# Render's free plan puts the API to sleep after 15 idle minutes, and waking it takes about
# a minute. This pings a cheap endpoint (no AI call) every 10 minutes so reviewers never wait.
# Set the repository variable NIRNAY_API_URL (Settings → Secrets and variables → Actions → Variables).
name: Keep the demo API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.NIRNAY_API_URL != '' }}
    steps:
      - name: Ping the API
        run: curl -fsS --max-time 90 "${{ vars.NIRNAY_API_URL }}/api/settings" -o /dev/null && echo "awake"
